name: Publish to npm

# 触发方式：推一个 v* 标签，例如
#   git tag v0.2.0 && git push origin v0.2.0
# 前置：仓库 Settings → Secrets and variables → Actions 添加 NPM_TOKEN（npm 的 Automation Token）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # npm provenance 签名需要

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发布前质量门禁：任一失败即中止，不带病发布
      - name: Build
        run: pnpm build
      - name: Selfcheck
        run: node dist/index.js --selfcheck
      - name: Doctor
        run: node dist/index.js --doctor
      - name: Unit + smoke tests
        run: pnpm test

      # npm publish 会先触发 prepare 钩子（npm run build），确保 bin 已构建
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
