# 大禹 · 风格预设：历史正剧（lishi-zhengju）
# 用法：CDA_CONFIG_DIR=/绝对路径/presets/lishi-zhengju node dist/index.js
# 整包替换 rules.yaml / platforms.yaml / prompts.md，改配置不改代码。
# 历史正剧核心：史实为骨、克制为美、时代语感统一；可计算的进规则，史观与厚重感交给 L3。
version: "0.2.0-zhengju.1"

meta:
  name: novel-cda-mcp
  display_name: 大禹·历史正剧
  slogan: 让时代自己说话
  stages: [positioning, locking, structure, execution, qa]
  note: "不教 AI 怎么写正剧，只告诉 AI 什么会毁掉正剧——网络流行语、系统流、时代错位、爽文式降智。"

# 平台档案：历史/正剧常投平台（公开资料整理，以官方最新公告为准）
platforms:
  qidian:
    name: 起点中文网·历史/正剧
    unsigned_traffic: 有
    exclusive: 分成/买断可选
    genres: [历史正剧, 架空历史, 历史群像, 王朝兴衰]
    patience: 较高
    title_min_chars: 5
    daily_words: [4000, 6000]
    golden_window: {conflict: 1400, golden_finger: 3500, payoff: 5500}
  zhihu:
    name: 知乎盐选·历史
    unsigned_traffic: 有
    exclusive: 签约制
    genres: [历史正剧, 历史细节, 人物传记, 史实向]
    patience: 较高
    title_min_chars: 5
    daily_words: [3000, 5000]
    golden_window: {conflict: 1200, golden_finger: 3000, payoff: 5000}
  custom:
    name: 自定义平台（历史正剧通用档）
    unsigned_traffic: 未提供公开标准，按正剧通用标准评审
    exclusive: 签约前需自行确认
    genres: []
    patience: 未知
    title_min_chars: 5
    daily_words: [4000, 8000]
    golden_window: {conflict: 1400, golden_finger: 3500, payoff: 5500}
    _fallback_template: true

# ---------------- L1：形态/结构红线（毫秒级 fatal 短路，不调 LLM）----------------
hard_reject:
  # 通用 L1 基准判据（保留：doctor/selfcheck 的判据样本依赖它）
  - id: reproducible_command
    pattern: '(?:\b(?:sudo|rm\s+-rf|chmod|chown|curl|wget|ssh|mysql|psql|UPDATE\s+\w+\s+SET|DELETE\s+FROM|DROP\s+TABLE|/etc/|/var/log/|/home/)\b)|(?:SELECT\s+.+\s+FROM\s+\w+)|(?:ALTER\s+TABLE)'
    action: reject
    level: fatal
    hint: 专业描写停在流程/结果层，不写可复现命令/参数序列（正剧同理）
  - id: internal_marker_leak
    pattern: '【本章标注】|【新埋伏笔|【回收伏笔|新埋 [LCF]\d|回收 [LCF]\d'
    action: reject
    level: fatal
    hint: 发布正文严禁内部标注块/伏笔编号泄漏——编号只存在台账，不进正文
  # 历史正剧风格专属判据（叠加）
  - id: internet_slang_leak
    pattern: '(?:yyds|YYDS|绝绝子|家人们|栓Q|泰裤辣|尊嘟假嘟|芭比Q|我勒个(?:豆|去)|破防了|躺平|内卷|打call|给力|秒懂|扎心了|老铁|集美|awsl|emmm|996|社畜)'
    action: reject
    level: fatal
    hint: 历史正剧正文禁网络流行语/现代梗——出戏即毁厚重感（这是轻喜剧的合法区，交叉验证用）
  - id: system_panel_leak
    pattern: '(?:叮[！!]|叮咚|恭喜宿主|系统(?:提示|绑定|奖励|精灵|空间)|属性(?:面板|点)|金手指(?:弹窗|提示)|\[系统\]|【系统】|新手礼包|任务(?:发布|完成)[：:]|宿主你好)'
    action: reject
    level: fatal
    hint: 历史正剧正文禁系统流/面板流套路——正剧靠人物与制度推进，不靠弹窗（这是所有其他 presets 的合法区，交叉验证用）
  - id: markdown_residue
    pattern: '^\s*#{1,6}\s|\*\*[^*]+\*\*|^\s*```|^\s*>\s'
    action: flag
    level: serious
    hint: 发布版为纯文本，去 Markdown 残留

# ---------------- L2：关键词/结构打分（百毫秒级）----------------
classifier:
  - id: ai_flavor
    desc: AI 味红黄牌（正剧版：通用红牌 + 现代口语暗示）
    level: minor
    red_words: [仿佛, 似乎, 宛如, 在这一刻, 五味杂陈, 值得一提的是, 让我们, 某种意义上, 悄然, 不由得, 下意识地, 沉默了片刻, 意味深长, 百感交集, 莫名]
    red_word_limit_per_chapter: 1
    greasy_words: [狂妄一笑, 嘴角勾起, 勾起一抹, 嘴角扬起, 区区也配, 全场震惊, 气势如虹, 眼中杀意, 杀意凛然, 冷笑一声, 扬长而去]
    patterns:
      - {id: not_a_but_b, pattern: '不是.{1,24}而是', limit: 2}
      - {id: this_is_x, pattern: '这[，,]就是', limit: 1}
      - {id: dash_overuse, pattern: '——', limit: 3}
      - {id: sublimation_end, pattern: '(?:或许|这)，?就是.{0,12}(?:代价|命运|成长)[^。！？」]*[。！？」]', limit: 1}
  - id: anachronism
    desc: 时代错位（现代物件/制度/观念误入古代语境，弱信号待 L3 判定）
    level: serious
    keywords: [手机, 微信, 朋友圈, 电脑, 上网, 打游戏, 公司, 老板, 员工, 打卡, 快递, 外卖, 地铁, 电梯, 空调, 警察局, 身份证, 心理学, 潜意识]
    patterns:
      - {id: modern_measure, pattern: '[0-9]+(?:公里|米|公斤|毫升|伏特|兆|G|GB)', limit: 1}
  - id: drama_exaggeration
    desc: 爽文式夸张（正剧忌浮夸降智）
    level: serious
    keywords: [全场震惊, 所有人都惊呆了, 打脸, 爽文, 一巴掌扇死, 碾压, 无敌, 龙傲天, 开挂]
    patterns:
      - {id: everyone_shocked, pattern: '(?:全场|所有人|满朝|众人)(?:都)?(?:震惊|惊呆|哗然|倒吸一口凉气)', limit: 1}
  - id: compliance_soft
    desc: 合规软信号（正剧涉及史实/民族/宗教，最终由 L3/人工判定）
    level: serious
    keywords: [史实硬伤,  unjust, 民族歧视, 宗教丑化, 美化侵略, 影射当代政治, 历史虚无主义]
  - id: weak_hook
    desc: 章末套语（氛围收尾/格言总结）
    level: minor
    keywords: [他知道, 这一切才刚刚开始, 故事还在继续, 未完待续, 仿佛一切都]

# ---------------- 反漂移（正剧：爽文化/时代错位/人物脸谱化/史观失衡）----------------
anti_drift:
  persona_signals:
    - {id: shuangwen_drift, desc: 正剧滑向爽文——降智反派/无脑打脸, pattern: '(?:反派|对手|敌人)(?:竟然|居然|愚蠢)|一(?:招|掌|句话)(?:就)?(?:搞定|碾压|秒杀)', level: high}
    - {id: anachronism_drift, desc: 时代错位——现代思维/物件漏进古代, pattern: '他(?:掏出|拿出)(?:手机|名片)|(?:现代|前世)(?:的)?(?:知识|思维|记忆)', level: mid}
    - {id: flat_character, desc: 人物脸谱化——忠奸善恶一眼见底, pattern: '(?:他|她)(?:天生|从小)就(?:是个)?(?:坏人|奸臣|忠臣|好人)', level: mid}
    - {id: exposition_dump, desc:  History 倾倒——大段史料/设定代替叙事, pattern: '(?:史书记载|据史|史料记载)[^。]{120,}', level: mid}
    - {id: deus_ex_machina, desc: 天降解围——靠巧合/奇迹不靠制度与人物, pattern: '恰好(?:路过|出现)|正好(?:有|赶到)|突然(?:天降|出现)|天无绝人之路', level: mid}
    - {id: tone_collapse, desc: 基调塌陷——正剧突然轻浮/戏说化, pattern: '故事(?:突然)?变了味|一本正经地(?:搞笑|胡闹)|戏说(?:一下)?', level: high}
  callbacks:
    - type: "类型1 · 网络流行语"
      keywords: [网络梗, 现代词, 出戏, yyds, 破防]
      symptom: 网络流行语/现代梗混入古代语境，厚重感尽失
      callback: 把现代说法换成符合时代的表达——用人物身份对应的语域说话，让时代自己说话。
    - type: "类型2 · 系统流入侵"
      keywords: [系统, 面板, 弹窗, 恭喜宿主, 金手指]
      symptom: 系统/属性面板弹窗污染正剧叙事
      callback: 删掉一切弹窗式表述，能力/机遇改写为人物抉择与环境机缘，靠因果不靠提示。
    - type: "类型3 · 时代错位"
      keywords: [时代错位, 穿越感, 现代物件, 现代制度]
      symptom: 现代物件/制度/观念误入古代语境
      callback: 核对设定年代，把错位物件替换为同时代对应物；若是穿越设定，须在锁定层明确开禁。
    - type: "类型4 · 爽文化漂移"
      keywords: [爽文, 打脸, 降智反派, 无脑, 龙傲天]
      symptom: 正剧滑向无脑爽文，反派降智、局面一键通关
      callback: 恢复制度与人物博弈——对手要有真实筹码，胜利要付出代价，避免全场震惊式反应。
    - type: "类型5 · 人物脸谱化"
      keywords: [脸谱化, 工具人, 忠奸分明, 纸片人]
      symptom: 人物非黑即白，缺少动机层次
      callback: 给每个关键人物一组相互冲突的动机，让阵营内部也有分歧，忠奸不写在脸上。
    - type: "类型6 · AI 味堆积"
      keywords: [抽象情绪, ai味, AI味, 抽象, 总结升华]
      symptom: 连续多章出现抽象情绪
      callback: 用「对照样本」重写该章，强制具体仪制/动作/对话分寸/个体反应。

# ---------------- 单章内部自洽（确定性弱信号，只报 suspect，不判 fatal）----------------
self_consistency:
  enabled: true
  time_anchor:
    patterns: ['第[0-9一二三四五六七八九十百]+天', '第[0-9一二三四五六七八九十百]+章', '[0-9一二三四五六七八九十]{1,2}月[0-9一二三四五六七八九十]{1,3}[日号]', '[0-9一二三四五六七八九十]{1,2}[:：][0-9]{2}']
    unordered_words: [突然想起, 回到, 回忆, 倒叙, 与此同时, 前一天, 三天前, 上个月]
    max_backward_jumps: 1
  numeric_conflict:
    unit_pattern: '([0-9一二三四五六七八九十百千万两]+\.?[0-9]?)\s*(块|元|毛|斤|斤两|岁|天|年|次|个|只|条|人)'
    contradiction_words: [但, 却, 然而, 反而, 其实, 结果]
    window_chars: 60
  entity_alias:
    patterns: ['(?:老|小)[一-龥]{1,2}']
    min_occurrences: 2

# ---------------- 节奏信号（正剧：大势铺陈，钩子沉稳）----------------
pacing_signals:
  enabled: true
  # 通用基准词（doctor 判据样本依赖）+ 正剧专属词叠加
  payoff_words: [成交, 拿下, 签下, 赚, 到手, 反杀, 打脸, 突破, 升级, 通过, 批准, 翻身, 回本, 兑现, 赢, 胜, 成功, 登基, 加封, 大捷, 定策, 收网, 平反, 称帝, 班师, 议和]
  conflict_words: [冲突, 争吵, 对峙, 威胁, 逼迫, 拒绝, 反击, 竞争, 质疑, 挑衅, 危机, 危险, 失败, 损失, 亏, 廷争, 构陷, 政变, 兵变, 弹劾, 废立, 边患]
  hook_words: [没想到, 却不知, 谁料, 殊不知, 竟然, 居然, 突然, 究竟, 原来, 直到, 才发现, 这时, 下一步, 等着, 果然, 且看, 不出所料, 反手, 谁能想到, 下一秒]
  payoff_per_2000_warn: 0.3
  conflict_per_1000_warn: 0.7
  hook_per_1000_warn: 0.6

# ---------------- 定位决策卡枚举（正剧版）----------------
positioning_enums:
  爽点类型: [庙堂博弈, 边境大捷, 沉冤昭雪, 制度建国, 人物成长]
  反派类型: [权臣, 外戚, 藩王, 外敌, 制度惯性]
  情感契约: [君臣相知, 家国情怀, 世事沉浮, 知己之交]

# ---------------- 字数分层区间（正剧：大势铺陈，字数偏大）----------------
# 必须保留「通用」键：init_project 的 tone 回退默认值
word_bands:
  通用: {静场: [2400, 3400], 常规: [3200, 4200], 反击: [3600, 4800], 高潮: [4400, 6400], 极短: [1400, 2200]}
  史诗: {静场: [2800, 3800], 常规: [3600, 4800], 反击: [4200, 5600], 高潮: [5000, 7200], 极短: [1600, 2400]}
  权谋: {静场: [2600, 3600], 常规: [3400, 4400], 反击: [3800, 5000], 高潮: [4400, 6400], 极短: [1500, 2200]}

# ---------------- 发布闸门评分卡锚点（正剧权重）----------------
rubric:
  dimensions:
    - {id: history, name: 史实/时代自洽, weight: 0.25, max: 25}
    - {id: character, name: 人物厚度, weight: 0.30, max: 30}
    - {id: structure, name: 大势结构, weight: 0.25, max: 25}
    - {id: writing, name: 正剧语域与分寸, weight: 0.20, max: 20}
  grades: {A: 满分（无问题）, B: 轻微扣（1-2 处小问题）, C: 明显扣（多处/反复）, D: 严重扣（致命伤）}
  score_map:
    history: {A: 25, B: 20, C: 12, D: 0}
    character: {A: 30, B: 24, C: 15, D: 0}
    structure: {A: 25, B: 20, C: 12, D: 0}
    writing: {A: 20, B: 16, C: 10, D: 0}
  verdict: {pass: 80, revise: 70, fatal_overrides: true}
  compliance_items:
    - 无网络流行语/现代梗（出戏即打回）
    - 无系统流/属性面板弹窗
    - 时代语感统一，无物件/制度错位（穿越设定须锁定层开禁）
    - 人物非脸谱化，忠奸不写在脸上
    - 无涉黄（露骨描写、擦边情节）
    - 无民族/宗教丑化与史实硬伤
    - 无暴力虐杀细节（写意化处理）
    - 无史实虚无/美化侵略

# ---------------- 爽点密度 / 事件库轮换（正剧版）----------------
cool_points:
  - 每章 ≥1 个有效的势力消长或人物抉择落地
  - 每 3 章 ≥1 次廷争/边患/制度推进
  - 每卷 3-5 个名场面（廷争/大捷/沉冤昭雪/废立）
  - 每 10 章 1 个中转盘；每卷末 1 个大势转折
event_rotation:
  - 四类事件库：A 庙堂压迫 / B 人物博弈 / C 大势转折 / D 日常调剂，各备 10 个
  - 不连续两章用同一类
  - A 后必跟 B 或 C（压迫→博弈/转折）
  - D 每 6-9 章一次（正剧也需要人物温度，防全程紧绷）
  - C 用于「看似定局」的翻转，须前文埋过制度/人物伏笔

# ---------------- 开新书 7 步 SOP（正剧版）----------------
sop:
  steps:
    - {step: 1, name: 定位（1 天）, tool: init_project, checks: [时代背景已定, 史观基调已定, 差异化一句话说得清, 情感契约已选]}
    - {step: 2, name: 找对立面（0.5 天）★ 关键, tool: save_card(tone), checks: [每个维度都能说出我不是什么, 对照表覆盖网络梗/系统流/爽文化/脸谱化边界]}
    - {step: 3, name: 建锁定层（1-2 天）, tool: save_card, checks: [时代语域边界清晰, 人物动机层次已定, 制度/势力关系已建, 穿越设定开禁与否已明确]}
    - {step: 4, name: 建结构层（2-3 天）, tool: add_foreshadow/save_outline, checks: [大势节点已定, 每章有势力消长或抉择, 伏笔编号含埋设/回收章, 事件库 40+]}
    - {step: 5, name: 建执行层（1 天）, tool: prompt build_system_prompt, checks: [prompt 含禁网络词/禁系统流, 节奏分层区间非死数, 正剧专属词表, 史观分寸已定]}
    - {step: 6, name: 建质检层（0.5 天）, tool: review_chapter/release_gate, checks: [评审分层, 有防时代错位检测项, 史实已核, 漂移回调方案具体]}
    - {step: 7, name: 小批量试产→评审→量产, tool: 试产10章+review_chapter, checks: [前 10 章已试产, 全审已跑, 问题已回调到规则层, 重跑确认稳定]}

# ---------------- 事实抽取 / 评审回流（P1 闭环）----------------
fact_extract:
  enabled: true
  unit_pattern: '([0-9一二三四五六七八九十百千万两]+\.?[0-9]?)\s*(块|元|毛|斤|岁|天|年|次|个|只|条|人)'
  label_chars: 8
  min_occurrences: 2
  max_anchors: 40
chapter_brief:
  enabled: true
  max_avoid: 8
  max_foreshadow: 8
  overdue_chapters: 10
