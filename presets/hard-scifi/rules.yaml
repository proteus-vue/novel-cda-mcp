# 大禹 · 风格预设：硬科幻（hard-scifi）
# 用法：CDA_CONFIG_DIR=/绝对路径/presets/hard-scifi node dist/index.js
# 整包替换 rules.yaml / platforms.yaml / prompts.md，改配置不改代码。
# 硬科幻核心：科学自洽 > 戏剧爽感；技术有代价、有边界、可验证；反玄学、反万能、反伪科学。
version: "0.2.0-scifi.1"

meta:
  name: novel-cda-mcp
  display_name: 大禹·硬科幻
  slogan: 在物理定律里跳舞
  stages: [positioning, locking, structure, execution, qa]
  note: "不教 AI 怎么写科幻，只告诉 AI 不能怎么写——技术有代价、设定自洽、反玄学反万能。"

# 平台档案：硬科幻常投平台（公开资料整理，以官方最新公告为准）
platforms:
  qidian:
    name: 起点中文网·科幻
    unsigned_traffic: 有
    exclusive: 分成/买断可选
    genres: [硬科幻, 太空歌剧, 未来世界, 时间旅行]
    patience: 较高
    title_min_chars: 5
    daily_words: [4000, 6000]
    golden_window: {conflict: 1200, golden_finger: 3000, payoff: 5000}
  zhihu:
    name: 知乎盐选·科幻
    unsigned_traffic: 有
    exclusive: 签约制
    genres: [硬科幻, 科学生态, 近未来, 技术伦理]
    patience: 中
    title_min_chars: 5
    daily_words: [3000, 5000]
    golden_window: {conflict: 800, golden_finger: 2500, payoff: 4500}
  custom:
    name: 自定义平台（硬科幻通用档）
    unsigned_traffic: 未提供公开标准，按硬科幻通用标准评审
    exclusive: 签约前需自行确认
    genres: []
    patience: 未知
    title_min_chars: 5
    daily_words: [4000, 8000]
    golden_window: {conflict: 800, golden_finger: 2000, payoff: 4000}
    _fallback_template: true

# ---------------- L1：形态/结构红线（毫秒级 fatal 短路，不调 LLM）----------------
hard_reject:
  # 通用 L1 基准判据（保留：doctor/selfcheck 的判据样本依赖它）
  - id: reproducible_command
    pattern: '(?:\b(?:sudo|rm\s+-rf|chmod|chown|curl|wget|ssh|mysql|psql|UPDATE\s+\w+\s+SET|DELETE\s+FROM|DROP\s+TABLE|/etc/|/var/log/|/home/)\b)|(?:SELECT\s+.+\s+FROM\s+\w+)|(?:ALTER\s+TABLE)'
    action: reject
    level: fatal
    hint: 专业描写停在原理/结果层，不写可复现的命令/参数序列（科幻中的系统操作同理）
  - id: internal_marker_leak
    pattern: '【本章标注】|【新埋伏笔|【回收伏笔|新埋 [LCF]\d|回收 [LCF]\d'
    action: reject
    level: fatal
    hint: 发布正文严禁内部标注块/伏笔编号泄漏——编号只存在台账，不进正文
  # 硬科幻风格专属判据（叠加）
  - id: xianxia_leak
    pattern: '(?:真气|灵力|内力|斗气|魂力|法力|魔力|咒语|结界|飞升|渡劫|金丹|元婴|筑基|炼气|巫术|神谕|意念移物|超能力觉醒|血脉觉醒|魂环|武魂)'
    action: reject
    level: fatal
    hint: 硬科幻正文禁修真/玄幻设定词——这是玄幻不是科幻；超能力必须改成设定内可解释的机制
  - id: pseudoscience_leak
    pattern: '(?:量子纠缠|量子)[\s\S]{0,12}(?:心意相通|瞬间沟通|传心|治愈|治病|改命|穿越时空回到过去)|(?:振动频率|能量场)[\s\S]{0,8}(?:疗愈|开运|改运)|(?:暗物质|暗能量)[\s\S]{0,8}(?:灵魂|意识体|精神力)'
    action: flag
    level: serious
    hint: 硬科幻禁伪科学——量子/暗物质/频率是物理概念，不能拿来当玄学万能贴；需要超光速须落在设定内并给机制
  - id: markdown_residue
    pattern: '^\s*#{1,6}\s|\*\*[^*]+\*\*|^\s*```|^\s*>\s'
    action: flag
    level: serious
    hint: 发布版为纯文本，去 Markdown 残留

# ---------------- L2：关键词/结构打分（百毫秒级）----------------
classifier:
  - id: ai_flavor
    desc: AI 味红黄牌（硬科幻版：通用红牌 + 科幻腔跑偏信号）
    level: minor
    red_words: [仿佛, 似乎, 宛如, 在这一刻, 五味杂陈, 值得一提的是, 让我们, 某种意义上, 悄然, 不由得, 下意识地, 沉默了片刻, 意味深长, 百感交集, 莫名]
    red_word_limit_per_chapter: 1
    greasy_words: [狂妄一笑, 嘴角勾起, 勾起一抹, 嘴角扬起, 区区也配, 全场震惊, 气势如虹, 眼中杀意, 杀意凛然, 冷笑一声, 扬长而去]
    patterns:
      - {id: not_a_but_b, pattern: '不是.{1,24}而是', limit: 2}
      - {id: this_is_x, pattern: '这[，,]就是', limit: 1}
      - {id: dash_overuse, pattern: '——', limit: 3}
      - {id: sublimation_end, pattern: '(?:或许|这)，?就是.{0,12}(?:代价|命运|成长)[^。！？」]*[。！？」]', limit: 1}
  - id: scifi_register
    desc: 科幻腔跑偏（玄学词泄漏 / 技术万能 / 硬凑术语）
    level: serious
    keywords: [真气, 灵力, 内力, 斗气, 魂力, 魔法, 咒语, 结界, 飞升, 渡劫, 金丹, 元婴, 巫术, 神谕, 天启神力, 念力操控一切, 意念移物, 超能力觉醒]
    patterns:
      - {id: tech_omnipotent, pattern: '(?:只要|凭借|依靠).{0,12}(?:技术|科技|算法|算力).{0,10}(?:就能|便可|就能解决|就能实现).{0,8}(?:一切|所有|任何|不存在的问题)', limit: 0}
      - {id: tech_no_cost, pattern: '毫无代价|没有任何代价|不消耗(?:任何)?(?:能量|资源|算力)|无限(?:能源|算力|能量)|凭空(?:产生|出现)', limit: 0}
      - {id: jargon_stuffing, pattern: '(?:量子|纳米|基因|光子|引力波|暗物质|熵|维度|平行宇宙)[^。]{0,6}(?:量子|纳米|基因|光子|引力波|暗物质|熵|维度|平行宇宙)[^。]{0,6}(?:量子|纳米|基因|光子|引力波|暗物质|熵|维度)', limit: 1}
  - id: compliance_soft
    desc: 合规软信号（硬红线之外的提示，最终由 L3/人工判定）
    level: serious
    keywords: [法律拿他没办法, 逍遥法外, 努力无用, 底层永无出头之日, 技术万能无需监管, 为达目的不择手段值得]
  - id: weak_hook
    desc: 章末套语（氛围收尾/格言总结）
    level: minor
    keywords: [他知道, 这一切才刚刚开始, 故事还在继续, 未完待续, 仿佛一切都]

# ---------------- 反漂移（硬科幻：技术万能/设定失守/科学观跑偏）----------------
anti_drift:
  persona_signals:
    - {id: over_explaining, desc: 科学家长篇科普——把小说写成说明书, pattern: '(?:他|她)(?:解释道|说道).{80,}', level: mid}
    - {id: tech_omnipotent, desc: 技术万能/金手指无边界——硬科幻大忌, pattern: '毫无代价|没有任何代价|轻而易举就(?:解决|突破|搞定)|不消耗(?:任何)?(?:能量|资源)', level: high}
    - {id: setting_breach, desc: 设定自相矛盾/突破已锁定边界, pattern: '违背(?:了)?(?:前面|此前|设定)|(?:说好|明明).{0,8}(?:不行|做不到).{0,8}(?:却|竟然)', level: high}
    - {id: mysticism_drift, desc: 玄学解释混入科学叙事, pattern: '因为(?:命运|天意|气运|缘分|冥冥之中)|(?:这就是|原来是)(?:天意|宿命|玄学)', level: high}
    - {id: deus_ex_machina, desc: 天降黑科技/巧合解围——靠运气不靠逻辑, pattern: '恰好(?:发现|造出)|正好(?:赶到|有)|突然(?:出现|发明)一(?:项|个)|天无绝人之路', level: mid}
    - {id: emotion_overreason, desc: 关键时刻纯情绪决策（理性角色漂移）, pattern: '不(?:顾一切|管三七二十一)|逻辑(?:什么|不重要)|为了(?:他|她).{0,10}(?:放弃|毁了).{0,10}(?:实验|计划|任务)', level: mid}
  callbacks:
    - type: "类型1 · 技术万能"
      keywords: [金手指太强, 技术万能, 无代价, 算力无限]
      symptom: 技术/金手指无边界无代价，问题一键解决
      callback: 给技术加三重枷锁（能量守恒/材料极限/时间成本），每次突破都要付出可见代价并引发新问题。
    - type: "类型2 · 设定失守"
      keywords: [设定崩, 自相矛盾, 吃设定, 突破边界]
      symptom: 前后设定打架，锁定的边界被随意突破
      callback: 回查锁定层：把冲突点写进硬数据校验表，明确「本项目做不到什么」，正文按边界重写。
    - type: "类型3 · 玄学漂移"
      keywords: [玄学, 伪科学, 量子玄学, 魔法化]
      symptom: 用玄学/伪科学当万能解释，硬科幻变玄幻
      callback: 要么给出机制与代价（落在科学设定内），要么删掉——量子/暗物质不是免死金牌。
    - type: "类型4 · 科普注水"
      keywords: [说明书, 科普太长, 术语堆砌, 注水]
      symptom: 大段科普把情节冲散，术语堆砌不掉书袋
      callback: 把知识塞进冲突与选择里：让角色为用某项技术付代价，读者在戏剧中读懂设定。
    - type: "类型5 · AI 味堆积"
      keywords: [抽象情绪, ai味, AI味, 抽象, 总结升华]
      symptom: 连续多章出现抽象情绪/总结升华
      callback: 用「对照样本」重写该章，强制具体仪器读数/操作步骤/个体反应。
    - type: "类型6 · 巧合解围"
      keywords: [天降黑科技, 巧合, 主角光环, 运气]
      symptom: 绝境靠巧合/天降黑科技化解
      callback: 把解围改成「前文埋过伏笔 + 角色主动选择 + 付出代价」的因果链。

# ---------------- 单章内部自洽（确定性弱信号，只报 suspect，不判 fatal）----------------
self_consistency:
  enabled: true
  time_anchor:
    patterns: ['第[0-9一二三四五六七八九十百]+天', '第[0-9一二三四五六七八九十百]+章', '[0-9一二三四五六七八九十]{1,2}月[0-9一二三四五六七八九十]{1,3}[日号]', '[0-9一二三四五六七八九十]{1,2}[:：][0-9]{2}', '(?:公元|纪元|星历)[0-9一二三四五六七八九十百千]{1,6}年']
    unordered_words: [突然想起, 回到, 回忆, 倒叙, 与此同时, 前一天, 三天前, 上个月]
    max_backward_jumps: 1
  numeric_conflict:
    unit_pattern: '([0-9一二三四五六七八九十百千万两]+\.?[0-9]?)\s*(光年|公里|米|千米|秒|分钟|小时|天|年|吨|千克|度|瓦|赫兹|倍|%|百分比|人|艘|台|次)'
    contradiction_words: [但, 却, 然而, 反而, 其实, 结果]
    window_chars: 60
  entity_alias:
    patterns: ['(?:老|小)[一-龥]{1,2}']
    min_occurrences: 2

# ---------------- 节奏信号（硬科幻：重验证与突破，数据可驱动）----------------
pacing_signals:
  enabled: true
  # 通用基准词（doctor 判据样本依赖）+ 硬科幻专属词叠加
  payoff_words: [成交, 拿下, 签下, 赚, 到手, 反杀, 打脸, 突破, 升级, 通过, 批准, 翻身, 回本, 兑现, 赢, 胜, 成功, 暗爽, 验证, 校准, 点火, 对接, 入轨, 捕获, 复现, 吻合, 攻克, 证实, 发现, 解锁]
  conflict_words: [冲突, 争吵, 对峙, 威胁, 逼迫, 拒绝, 反击, 竞争, 质疑, 挑衅, 危机, 危险, 失败, 损失, 亏, 故障, 失控, 偏差, 过载, 泄漏, 断电, 失联, 辐射, 坍塌, 告警, 异常, 悖论]
  hook_words: [没想到, 却不知, 谁料, 殊不知, 竟然, 居然, 突然, 究竟, 原来, 直到, 才发现, 这时, 下一步, 等着, 果然, 且看, 不出所料, 反手, 然而数据, 但读数, 探测显示, 信号消失, 日志里]
  payoff_per_2000_warn: 0.3
  conflict_per_1000_warn: 0.8
  hook_per_1000_warn: 0.6

# ---------------- 定位决策卡枚举（硬科幻版）----------------
positioning_enums:
  爽点类型: [技术碾压, 硬核解谜, 绝境求生, 发现揭示, 工程奇迹]
  反派类型: [未知环境, 对手文明, 制度, 技术伦理困境]
  情感契约: [战友情, 理性共鸣, 孤独感, 人性微光]

# ---------------- 字数分层区间（硬科幻：设定密度高，字数偏大）----------------
# 必须保留「通用」键：init_project 的 tone 回退默认值
word_bands:
  通用: {静场: [1800, 2800], 常规: [2600, 3600], 反击: [3000, 4200], 高潮: [4000, 6000], 极短: [1000, 1800]}
  硬核: {静场: [2200, 3200], 常规: [3000, 4200], 反击: [3400, 4800], 高潮: [4400, 6500], 极短: [1200, 2000]}
  冷感: {静场: [2200, 3200], 常规: [3000, 4200], 反击: [3400, 4800], 高潮: [4400, 6500], 极短: [1200, 2000]}

# ---------------- 发布闸门评分卡锚点（硬科幻权重）----------------
rubric:
  dimensions:
    - {id: character, name: 人设/科学家行为, weight: 0.20, max: 20}
    - {id: structure, name: 科学自洽与因果, weight: 0.30, max: 30}
    - {id: continuity, name: 连续与伏笔, weight: 0.20, max: 20}
    - {id: writing, name: 硬核质感与格式, weight: 0.30, max: 30}
  grades: {A: 满分（无问题）, B: 轻微扣（1-2 处小问题）, C: 明显扣（多处/反复）, D: 严重扣（致命伤）}
  score_map:
    character: {A: 20, B: 16, C: 10, D: 0}
    structure: {A: 30, B: 24, C: 15, D: 0}
    continuity: {A: 20, B: 16, C: 10, D: 0}
    writing: {A: 30, B: 24, C: 15, D: 0}
  verdict: {pass: 80, revise: 70, fatal_overrides: true}
  compliance_items:
    - 无伪科学/玄学泄漏（量子/暗物质等物理概念不被当万能贴）
    - 技术有代价、有边界、可验证，非一键万能
    - 设定前后自洽，锁定边界不被随意突破
    - 反派/困境有真实阻力，非天降巧合解围
    - 无涉黄（露骨描写、擦边情节）
    - 无暴力虐杀细节（写意化处理）
    - 无违法教学（详细犯罪/危险技术复现手法）
    - 情绪底色有希望（无虚无主义/宣扬认命）

# ---------------- 爽点密度 / 事件库轮换（硬科幻版）----------------
cool_points:
  - 每章 ≥1 处认知刷新（新事实/新数据/新机制揭露）
  - 每 3 章 ≥1 次技术验证或突破（且付出代价）
  - 每卷 3-5 个名场面（点火/对接/首次实验/绝境计算）
  - 每 10 章 1 个中转盘；每卷末 1 个大揭示
event_rotation:
  - 四类事件库：A 未知压迫 / B 技术分析反制 / C  reveal 翻转 / D 人性共鸣，各备 10 个
  - 不连续两章用同一类
  - A 后必跟 B（困境→技术分析），突破须有代价
  - D 每 6-9 章一次（硬科幻理性底色，情感调节频次低于爽文）
  - C 用于「看似无解」的翻盘，须前文埋过科学伏笔

# ---------------- 开新书 7 步 SOP（硬科幻版）----------------
sop:
  steps:
    - {step: 1, name: 定位（1 天）, tool: init_project, checks: [科学基调已定, 核心设定一句话说得清, 差异化爽点已选, 情感契约已选]}
    - {step: 2, name: 找对立面（0.5 天）★ 关键, tool: save_card(tone), checks: [每个维度都能说出我不是什么, 对照表覆盖技术边界/科学观/情绪/章名/禁用词]}
    - {step: 3, name: 建锁定层（1-2 天）, tool: save_card, checks: [技术边界清晰（不万能）, 代价机制明确, 反派/困境有真实阻力, 硬数据校验表已建]}
    - {step: 4, name: 建结构层（2-3 天）, tool: add_foreshadow/save_outline, checks: [科学伏笔已定, 每章有认知刷新, 伏笔编号含埋设/回收章, 事件库 40+]}
    - {step: 5, name: 建执行层（1 天）, tool: prompt build_system_prompt, checks: [prompt 含禁用玄学词, 字数分层区间非死数, 科幻专属词表, 科普与剧情配比已定]}
    - {step: 6, name: 建质检层（0.5 天）, tool: review_chapter/release_gate, checks: [评审分层, 有防技术万能检测项, 科学自洽已核, 漂移回调方案具体]}
    - {step: 7, name: 小批量试产→评审→量产, tool: 试产10章+review_chapter, checks: [前 10 章已试产, 全审已跑, 问题已回调到规则层, 重跑确认稳定]}

# ---------------- 事实抽取 / 评审回流（P1 闭环）----------------
fact_extract:
  enabled: true
  unit_pattern: '([0-9一二三四五六七八九十百千万两]+\.?[0-9]?)\s*(光年|公里|米|千米|秒|分钟|小时|天|年|吨|千克|度|瓦|赫兹|倍|%|人|艘|台|次)'
  label_chars: 8
  min_occurrences: 2
  max_anchors: 40
chapter_brief:
  enabled: true
  max_avoid: 8
  max_foreshadow: 8
  overdue_chapters: 10
