# 大禹 · 风格预设：悬疑推理（xuanyi-tuili）
# 用法：CDA_CONFIG_DIR=/绝对路径/presets/xuanyi-tuili node dist/index.js
# 整包替换 rules.yaml / platforms.yaml / prompts.md，改配置不改代码。
# 悬疑核心：线索公平、推理落地、反派不降智、解答不靠超自然；可计算的进规则，诡计是否精妙交给 L3。
version: "0.2.0-tuili.1"

meta:
  name: novel-cda-mcp
  display_name: 大禹·悬疑推理
  slogan: 线索必须公平
  stages: [positioning, locking, structure, execution, qa]
  note: "不教 AI 怎么设计诡计，只告诉 AI 什么会毁掉推理——破案跳步、超自然解答、反派降智、线索藏私。"

# 平台档案：悬疑推理常投平台（公开资料整理，以官方最新公告为准）
platforms:
  qidian:
    name: 起点中文网·悬疑/侦探
    unsigned_traffic: 有
    exclusive: 分成/买断可选
    genres: [悬疑推理, 侦探, 密室, 刑侦]
    patience: 较高
    title_min_chars: 5
    daily_words: [4000, 6000]
    golden_window: {conflict: 1000, golden_finger: 2500, payoff: 4000}
  zhihu:
    name: 知乎盐选·悬疑
    unsigned_traffic: 有
    exclusive: 签约制
    genres: [悬疑推理, 本格, 社会派, 反转]
    patience: 中
    title_min_chars: 5
    daily_words: [3000, 5000]
    golden_window: {conflict: 800, golden_finger: 2200, payoff: 3800}
  custom:
    name: 自定义平台（悬疑推理通用档）
    unsigned_traffic: 未提供公开标准，按悬疑通用标准评审
    exclusive: 签约前需自行确认
    genres: []
    patience: 未知
    title_min_chars: 5
    daily_words: [4000, 7000]
    golden_window: {conflict: 1000, golden_finger: 2500, payoff: 4000}
    _fallback_template: true

# ---------------- L1：形态/结构红线（毫秒级 fatal 短路，不调 LLM）----------------
hard_reject:
  # 通用 L1 基准判据（保留：doctor/selfcheck 的判据样本依赖它）
  - id: reproducible_command
    pattern: '(?:\b(?:sudo|rm\s+-rf|chmod|chown|curl|wget|ssh|mysql|psql|UPDATE\s+\w+\s+SET|DELETE\s+FROM|DROP\s+TABLE|/etc/|/var/log/|/home/)\b)|(?:SELECT\s+.+\s+FROM\s+\w+)|(?:ALTER\s+TABLE)'
    action: reject
    level: fatal
    hint: 专业描写停在流程/结果层，不写可复现命令/参数序列（悬疑作品同理）
  - id: internal_marker_leak
    pattern: '【本章标注】|【新埋伏笔|【回收伏笔|新埋 [LCF]\d|回收 [LCF]\d'
    action: reject
    level: fatal
    hint: 发布正文严禁内部标注块/伏笔编号泄漏——编号只存在台账，不进正文
  # 悬疑推理风格专属判据（叠加）
  - id: skipped_deduction_leak
    pattern: '(?:轻而易举(?:地)?(?:破解|破案|侦破|抓住|找到)|没费(?:什么)?(?:力气|功夫|周折)(?:就)?(?:破案|破解|抓住|找到)|很快(?:就)?(?:破案|抓住(?:凶手|真凶)|找到(?:凶手|真凶))|不费吹灰之力(?:就)?(?:破案|破解)|(?:一下|一步)?(?:就)?(?:猜中|猜对)凶手)'
    action: reject
    level: fatal
    hint: 悬疑正文禁推理跳步——破案必须落地为线索→验证→锁定，禁止「轻而易举破解/很快抓住凶手」式糊弄
  - id: supernatural_solution_leak
    pattern: '(?:原来是鬼|凶手是鬼|超自然(?:力量|现象|存在)(?:所为|作祟|导致)|外星人(?:干的|作案|所为)|鬼魂(?:复仇|作祟|杀人)|(?:精神分裂|人格分裂)(?:患者)?(?:才是真凶|凶手)|(?:幻想|臆想)出来的凶手)'
    action: reject
    level: fatal
    hint: 悬疑解答必须给得出机制——禁止用鬼神/外星人/精神分裂做万能谜底（超自然设定须前置到世界观并在正文给证据）
  - id: markdown_residue
    pattern: '^\s*#{1,6}\s|\*\*[^*]+\*\*|^\s*```|^\s*>\s'
    action: flag
    level: serious
    hint: 发布版为纯文本，去 Markdown 残留

# ---------------- L2：关键词/结构打分（百毫秒级）----------------
classifier:
  - id: ai_flavor
    desc: AI 味红黄牌（悬疑版：通用红牌 + 灵异暗示信号）
    level: minor
    red_words: [仿佛, 似乎, 宛如, 在这一刻, 五味杂陈, 值得一提的是, 让我们, 某种意义上, 悄然, 不由得, 下意识地, 沉默了片刻, 意味深长, 百感交集, 莫名]
    red_word_limit_per_chapter: 1
    greasy_words: [狂妄一笑, 嘴角勾起, 勾起一抹, 嘴角扬起, 区区也配, 全场震惊, 气势如虹, 眼中杀意, 杀意凛然, 冷笑一声, 扬长而去]
    patterns:
      - {id: not_a_but_b, pattern: '不是.{1,24}而是', limit: 2}
      - {id: this_is_x, pattern: '这[，,]就是', limit: 1}
      - {id: dash_overuse, pattern: '——', limit: 3}
      - {id: sublimation_end, pattern: '(?:或许|这)，?就是.{0,12}(?:代价|命运|成长)[^。！？」]*[。！？」]', limit: 1}
  - id: unfair_clue
    desc: 线索藏私（侦探凭空拿出关键证据——对读者不公平）
    level: serious
    keywords: [原来早有准备, 他早就知道, 一直没说, 事先藏好, 偷偷跟着, 恰好带着, 正好有证据, 突然拿出一份]
    patterns:
      - {id: evidence_from_nowhere, pattern: '(?:突然|这时)(?:从|拿|掏)出(?:一份|一张|那个)|证据(?:就)?(?:在|来自)(?:他|她)手(?:里|中)', limit: 1}
  - id: villain_dumb
    desc: 反派降智（凶手自爆/主动交底/笨到不合理）
    level: serious
    keywords: [凶手自首, 主动交代, 自己说出来, 以为没人发现, 得意忘形, 主动承认, 愚蠢的凶手]
    patterns:
      - {id: confession_dump, pattern: '(?:凶手|真凶|他)(?:主动|亲自|当场)(?:交代|承认|说出)(?:全部|一切|作案过程)', limit: 1}
  - id: compliance_soft
    desc: 合规软信号（硬红线之外的提示，最终由 L3/人工判定）
    level: serious
    keywords: [详细作案手法, 具体投毒剂量, 如何制作凶器, 美化连环杀人, 模仿犯罪细节, 警方无能到底]
  - id: weak_hook
    desc: 章末套语（氛围收尾/格言总结）
    level: minor
    keywords: [他知道, 这一切才刚刚开始, 故事还在继续, 未完待续, 仿佛一切都]

# ---------------- 反漂移（悬疑：反转无铺垫/红鲱鱼滥用/侦探全知/反派降智）----------------
anti_drift:
  persona_signals:
    - {id: twist_no_setup, desc: 反转无铺垫——揭底靠临时编, pattern: '原来(?:他|她)(?:一直|早就)[^。]{0,20}|真相(?:是|竟然是)[^。]{0,20}(?:却|但)前文', level: high}
    - {id: red_herring_abuse, desc: 红鲱鱼滥用——误导线索多到读者麻木, pattern: '又一个嫌疑人|所有人都(?:有|是)嫌疑|每个人都(?:可疑|撒谎)', level: mid}
    - {id: detective_omniscient, desc: 侦探全知——未经推理直接知道答案, pattern: '(?:他|她)(?:一眼|立刻|马上)就(?:看出|知道|明白)(?:凶手|真相|答案)', level: mid}
    - {id: villain_stupidity, desc: 反派降智——凶手自爆/主动交底, pattern: '(?:凶手|真凶)(?:主动|当场)(?:交代|承认|自首)', level: high}
    - {id: logic_gap, desc: 逻辑断链——结论与证据对不上, pattern: '所以(?:他|她)就是凶手|因此(?:真相|答案)大白', level: mid}
    - {id: clue_dump, desc: 线索倾倒——大段解释代替演绎, pattern: '(?:也就是说|换句话说)[^。]{100,}', level: mid}
  callbacks:
    - type: "类型1 · 破案跳步"
      keywords: [破案太快, 轻而易举, 抓住凶手, 推理跳过]
      symptom: 推理过程被跳过，结论直接落下
      callback: 把破案拆成「线索→验证→锁定」三步，每步给读者可核对的证据，让读者先于侦探看出端倪。
    - type: "类型2 · 超自然解答"
      keywords: [鬼神, 超自然, 外星人, 精神分裂, 万能谜底]
      symptom: 谜底用超自然力量糊弄，读者无法公平推理
      callback: 把解答拉回机制内——若是超自然设定，须在前文给出规则与证据，不能到结尾才抛。
    - type: "类型3 · 线索藏私"
      keywords: [线索藏私, 突然拿出证据, 侦探开挂, 不公平]
      symptom: 关键证据侦探早有却不说，揭底时才掏出
      callback: 把关键线索前置到读者可见处，让推理公平——读者应能用已有信息推出真相。
    - type: "类型4 · 反派降智"
      keywords: [反派降智, 凶手自爆, 主动交代, 笨]
      symptom: 凶手自爆/主动交底，博弈失去张力
      callback: 让凶手有真实反制与伪装，破案靠证据链而非自白；反派越聪明，侦破越有分量。
    - type: "类型5 · 红鲱鱼滥用"
      keywords: [红鲱鱼, 误导太多, 嫌疑人太多, 麻木]
      symptom: 误导线索堆叠到读者放弃推理
      callback: 红鲱鱼每卷 2-3 个即可，每个都要回收成有用信息——误导也要服务于最终谜底。
    - type: "类型6 · AI 味堆积"
      keywords: [抽象情绪, ai味, AI味, 抽象, 总结升华]
      symptom: 连续多章出现抽象情绪
      callback: 用「对照样本」重写该章，强制具体物证/动作/对话节奏/个体反应。

# ---------------- 单章内部自洽（确定性弱信号，只报 suspect，不判 fatal）----------------
self_consistency:
  enabled: true
  time_anchor:
    patterns: ['第[0-9一二三四五六七八九十百]+天', '第[0-9一二三四五六七八九十百]+章', '[0-9一二三四五六七八九十]{1,2}月[0-9一二三四五六七八九十]{1,3}[日号]', '[0-9一二三四五六七八九十]{1,2}[:：][0-9]{2}']
    unordered_words: [突然想起, 回到, 回忆, 倒叙, 与此同时, 前一天, 三天前, 上个月]
    max_backward_jumps: 1
  numeric_conflict:
    unit_pattern: '([0-9一二三四五六七八九十百千万两]+\.?[0-9]?)\s*(块|元|毛|斤|斤两|岁|天|年|次|个|只|条|人)'
    contradiction_words: [但, 却, 然而, 反而, 其实, 结果]
    window_chars: 60
  entity_alias:
    patterns: ['(?:老|小)[一-龥]{1,2}']
    min_occurrences: 2

# ---------------- 节奏信号（悬疑：线索密、反转狠、钩子稳）----------------
pacing_signals:
  enabled: true
  # 通用基准词（doctor 判据样本依赖）+ 悬疑专属词叠加
  payoff_words: [成交, 拿下, 签下, 赚, 到手, 反杀, 打脸, 突破, 升级, 通过, 批准, 翻身, 回本, 兑现, 赢, 胜, 成功, 破案, 侦破, 锁定, 真相, 揭底, 抓到, 认罪, 还原]
  conflict_words: [冲突, 争吵, 对峙, 威胁, 逼迫, 拒绝, 反击, 竞争, 质疑, 挑衅, 危机, 危险, 失败, 损失, 亏, 嫌疑, 追查, 阻挠, 灭口, 伪证, 栽赃, 反转]
  hook_words: [没想到, 却不知, 谁料, 殊不知, 竟然, 居然, 突然, 究竟, 原来, 直到, 才发现, 这时, 下一步, 等着, 果然, 且看, 不出所料, 反手, 谁能想到, 下一秒]
  payoff_per_2000_warn: 0.4
  conflict_per_1000_warn: 0.9
  hook_per_1000_warn: 0.8

# ---------------- 定位决策卡枚举（悬疑版）----------------
positioning_enums:
  爽点类型: [本格解谜, 身份反转, 密室诡计, 追凶博弈, 真相揭底]
  反派类型: [高智商凶手, 伪装者, 内鬼, 连环犯, 幕后黑手]
  情感契约: [智斗博弈, 猫鼠游戏, 真相追寻, 冤案平反]

# ---------------- 字数分层区间（悬疑：缜密铺陈，字数偏中上）----------------
# 必须保留「通用」键：init_project 的 tone 回退默认值
word_bands:
  通用: {静场: [2000, 3000], 常规: [2800, 3800], 反击: [3200, 4400], 高潮: [4000, 6000], 极短: [1200, 2000]}
  缜密: {静场: [2200, 3200], 常规: [3000, 4200], 反击: [3400, 4800], 高潮: [4200, 6500], 极短: [1400, 2200]}
  惊险: {静场: [1800, 2600], 常规: [2400, 3400], 反击: [3000, 4000], 高潮: [3800, 5600], 极短: [1000, 1600]}

# ---------------- 发布闸门评分卡锚点（悬疑权重）----------------
rubric:
  dimensions:
    - {id: logic, name: 逻辑闭环, weight: 0.30, max: 30}
    - {id: fairness, name: 线索公平, weight: 0.25, max: 25}
    - {id: villain, name: 反派强度, weight: 0.20, max: 20}
    - {id: suspense, name: 悬念节奏, weight: 0.25, max: 25}
  grades: {A: 满分（无问题）, B: 轻微扣（1-2 处小问题）, C: 明显扣（多处/反复）, D: 严重扣（致命伤）}
  score_map:
    logic: {A: 30, B: 24, C: 15, D: 0}
    fairness: {A: 25, B: 20, C: 12, D: 0}
    villain: {A: 20, B: 16, C: 10, D: 0}
    suspense: {A: 25, B: 20, C: 12, D: 0}
  verdict: {pass: 80, revise: 70, fatal_overrides: true}
  compliance_items:
    - 无破案跳步（推理落地为线索→验证→锁定）
    - 无超自然万能谜底（解答给出机制与证据）
    - 线索公平，关键证据前置读者可见
    - 反派有真实反制，非自爆/降智
    - 无详细可模仿的作案手法
    - 无涉黄（露骨描写、擦边情节）
    - 无暴力虐杀细节（写意化处理）
    - 无违法教学（详细犯罪手法）

# ---------------- 爽点密度 / 事件库轮换（悬疑版）----------------
cool_points:
  - 每章 ≥1 个新线索或新疑点落地
  - 每 3 章 ≥1 次反转/身份疑云
  - 每卷 3-5 个名场面（密室揭底/追凶反转/真相还原）
  - 每 10 章 1 个中转盘；每卷末 1 个大揭底
event_rotation:
  - 四类事件库：A 案发压迫 / B 线索追查 / C 反转揭底 / D 人物调剂，各备 10 个
  - 不连续两章用同一类
  - A 后必跟 B 或 C（案发→追查/揭底）
  - D 每 6-9 章一次（悬疑也需要人物温度，防纯解谜疲劳）
  - C 用于「看似结案」的翻案，须前文埋过反证伏笔

# ---------------- 开新书 7 步 SOP（悬疑版）----------------
sop:
  steps:
    - {step: 1, name: 定位（1 天）, tool: init_project, checks: [谜题类型已定, 解答机制已定, 差异化一句话说得清, 情感契约已选]}
    - {step: 2, name: 找对立面（0.5 天）★ 关键, tool: save_card(tone), checks: [每个维度都能说出我不是什么, 对照表覆盖跳步/超自然/降智/藏私边界]}
    - {step: 3, name: 建锁定层（1-2 天）, tool: save_card, checks: [侦探能力边界清晰, 反派真实阻力已定, 线索表已建, 红鲱鱼已规划]}
    - {step: 4, name: 建结构层（2-3 天）, tool: add_foreshadow/save_outline, checks: [线索埋设/回收章已编号, 每章有新线索或疑点, 事件库 40+]}
    - {step: 5, name: 建执行层（1 天）, tool: prompt build_system_prompt, checks: [prompt 含禁跳步禁超自然词, 节奏分层区间非死数, 悬疑专属词表, 线索公平尺度已定]}
    - {step: 6, name: 建质检层（0.5 天）, tool: review_chapter/release_gate, checks: [评审分层, 有防推理跳步检测项, 逻辑已核, 漂移回调方案具体]}
    - {step: 7, name: 小批量试产→评审→量产, tool: 试产10章+review_chapter, checks: [前 10 章已试产, 全审已跑, 问题已回调到规则层, 重跑确认稳定]}

# ---------------- 事实抽取 / 评审回流（P1 闭环）----------------
fact_extract:
  enabled: true
  unit_pattern: '([0-9一二三四五六七八九十百千万两]+\.?[0-9]?)\s*(块|元|毛|斤|岁|天|年|次|个|只|条|人)'
  label_chars: 8
  min_occurrences: 2
  max_anchors: 40
chapter_brief:
  enabled: true
  max_avoid: 8
  max_foreshadow: 8
  overdue_chapters: 10
