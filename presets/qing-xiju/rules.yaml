# 大禹 · 风格预设：轻喜剧（qing-xiju）
# 用法：CDA_CONFIG_DIR=/绝对路径/presets/qing-xiju node dist/index.js
# 整包替换 rules.yaml / platforms.yaml / prompts.md，改配置不改代码。
# 轻喜剧核心：笑点优先、苦情是毒、节奏明快、分寸不油；可计算的进规则，笑点成不成立交给 L3。
version: "0.2.0-xiju.1"

meta:
  name: novel-cda-mcp
  display_name: 大禹·轻喜剧
  slogan: 把苦情关在门外
  stages: [positioning, locking, structure, execution, qa]
  note: "不教 AI 怎么写笑点，只告诉 AI 什么会毁掉喜剧——苦情、说教、油腻、强行煽情。"

# 平台档案：轻喜剧/轻松向常投平台（公开资料整理，以官方最新公告为准）
platforms:
  qidian:
    name: 起点中文网·轻小说/搞笑
    unsigned_traffic: 有
    exclusive: 分成/买断可选
    genres: [轻喜剧, 日常搞笑, 轻松向, 吐槽向]
    patience: 较高
    title_min_chars: 5
    daily_words: [4000, 6000]
    golden_window: {conflict: 800, golden_finger: 2000, payoff: 3500}
  fanqie:
    name: 番茄小说·轻松搞笑
    unsigned_traffic: 有
    exclusive: 签约制
    genres: [轻松搞笑, 沙雕, 日常, 都市轻喜]
    patience: 中
    title_min_chars: 5
    daily_words: [4000, 8000]
    golden_window: {conflict: 600, golden_finger: 1500, payoff: 3000}
  custom:
    name: 自定义平台（轻喜剧通用档）
    unsigned_traffic: 未提供公开标准，按轻喜剧通用标准评审
    exclusive: 签约前需自行确认
    genres: []
    patience: 未知
    title_min_chars: 5
    daily_words: [4000, 8000]
    golden_window: {conflict: 800, golden_finger: 2000, payoff: 3500}
    _fallback_template: true

# ---------------- L1：形态/结构红线（毫秒级 fatal 短路，不调 LLM）----------------
hard_reject:
  # 通用 L1 基准判据（保留：doctor/selfcheck 的判据样本依赖它）
  - id: reproducible_command
    pattern: '(?:\b(?:sudo|rm\s+-rf|chmod|chown|curl|wget|ssh|mysql|psql|UPDATE\s+\w+\s+SET|DELETE\s+FROM|DROP\s+TABLE|/etc/|/var/log/|/home/)\b)|(?:SELECT\s+.+\s+FROM\s+\w+)|(?:ALTER\s+TABLE)'
    action: reject
    level: fatal
    hint: 专业描写停在流程/结果层，不写可复现命令/参数序列（轻松向作品同理）
  - id: internal_marker_leak
    pattern: '【本章标注】|【新埋伏笔|【回收伏笔|新埋 [LCF]\d|回收 [LCF]\d'
    action: reject
    level: fatal
    hint: 发布正文严禁内部标注块/伏笔编号泄漏——编号只存在台账，不进正文
  # 轻喜剧风格专属判据（叠加）
  - id: melodrama_leak
    pattern: '(?:吐血|心如刀绞|肝肠寸断|痛不欲生|生离死别|泪如雨下|声泪俱下|撕心裂肺|万念俱灰|痛彻心扉|惨死|含恨而终|不治身亡|血的教训)'
    action: reject
    level: fatal
    hint: 轻喜剧正文禁苦情虐心套路——情绪冲突改用误会/反差/吐槽化解，别让读者哭
  - id: markdown_residue
    pattern: '^\s*#{1,6}\s|\*\*[^*]+\*\*|^\s*```|^\s*>\s'
    action: flag
    level: serious
    hint: 发布版为纯文本，去 Markdown 残留

# ---------------- L2：关键词/结构打分（百毫秒级）----------------
classifier:
  - id: ai_flavor
    desc: AI 味红黄牌（轻喜剧版：通用红牌 + 强行煽情信号）
    level: minor
    red_words: [仿佛, 似乎, 宛如, 在这一刻, 五味杂陈, 值得一提的是, 让我们, 某种意义上, 悄然, 不由得, 下意识地, 沉默了片刻, 意味深长, 百感交集, 莫名]
    red_word_limit_per_chapter: 1
    greasy_words: [狂妄一笑, 嘴角勾起, 勾起一抹, 嘴角扬起, 区区也配, 全场震惊, 气势如虹, 眼中杀意, 杀意凛然, 冷笑一声, 扬长而去]
    patterns:
      - {id: not_a_but_b, pattern: '不是.{1,24}而是', limit: 2}
      - {id: this_is_x, pattern: '这[，,]就是', limit: 1}
      - {id: dash_overuse, pattern: '——', limit: 3}
      - {id: sublimation_end, pattern: '(?:或许|这)，?就是.{0,12}(?:代价|命运|成长)[^。！？」]*[。！？」]', limit: 1}
  - id: forced_emotion
    desc: 强行煽情/说教（轻喜剧大忌，破坏轻松基调）
    level: serious
    keywords: [这一刻他终于明白, 泪水夺眶而出, 眼眶湿润, 心中一紧, 沉重的代价, 人生就是这样, 世上没有后悔药, 血泪史]
    patterns:
      - {id: lecture_end, pattern: '(?:记住|记住了|要懂得|其实人生|做人要|这告诉我们)[^。]{0,30}[。！]', limit: 0}
      - {id: pathos_buildup, pattern: '(?:为了|因为).{0,12}(?:他|她).{0,8}(?:付出|牺牲).{0,10}(?:一切|全部|生命)', limit: 0}
  - id: comedy_register
    desc: 喜剧语域健康度（吐槽/反差是正向信号；恶搞过界是风险）
    level: minor
    keywords: [笑死, 绝了, 蚌埠住了, 绷不住, 笑不活了, 离谱, 离大谱, 好家伙, 破防]
    patterns:
      - {id: mean_spirit, pattern: '(?:笨蛋|废物|垃圾|蠢货)[^。]{0,10}(?:去死|该死|活该)', limit: 0}
  - id: compliance_soft
    desc: 合规软信号（硬红线之外的提示，最终由 L3/人工判定）
    level: serious
    keywords: [法律拿他没办法, 逍遥法外, 努力无用, 底层永无出头之日, 拿弱势群体开涮, 拿灾难玩梗]
  - id: weak_hook
    desc: 章末套语（氛围收尾/格言总结）
    level: minor
    keywords: [他知道, 这一切才刚刚开始, 故事还在继续, 未完待续, 仿佛一切都]

# ---------------- 反漂移（轻喜剧：强行煽情/主角毒舌化/笑点枯竭）----------------
anti_drift:
  persona_signals:
    - {id: over_explaining, desc: 主角长篇讲道理——说教型漂移, pattern: '(?:他|她)(?:解释道|说道|教导道).{80,}', level: mid}
    - {id: forced_pathos, desc: 强行煽情——从搞笑突然转苦情, pattern: '突然(?:沉默|严肃|红了眼眶)|气氛(?:突然)?变得沉重|笑不出来了', level: high}
    - {id: mean_spirit, desc: 毒舌越界成恶意攻击——喜剧变刻薄, pattern: '(?:废物|垃圾|蠢货|去死|该死|活该)', level: mid}
    - {id: joke_dry, desc: 笑点枯竭/硬抖机灵, pattern: '(?:冷场|没人笑|尴尬地|讪讪地|硬生生地笑)', level: mid}
    - {id: deus_ex_machina, desc: 天降好运/巧合解围——靠运气不靠铺垫, pattern: '恰好(?:路过|出现)|正好(?:有|赶到)|突然(?:天降|出现)|天无绝人之路', level: mid}
    - {id: tone_collapse, desc: 基调塌陷——轻松向突然黑暗化, pattern: '故事(?:突然)?变了|再也没有笑过|这一切(?:都)?不是玩笑', level: high}
  callbacks:
    - type: "类型1 · 强行煽情"
      keywords: [强行煽情, 突然严肃, 氛围变了, 笑不出来]
      symptom: 轻松向突然转苦情/说教
      callback: 把情绪冲突改回误会与反差——用夸张动作和吐槽化解，宁可荒诞不要沉重。
    - type: "类型2 · 毒舌越界"
      keywords: [毒舌过度, 刻薄, 人身攻击, 恶意]
      symptom: 吐槽变成对弱势/外貌/身份的恶意攻击
      callback: 吐槽对事不对人，笑点落在荒诞处境与角色自嘲，不落在羞辱对象。
    - type: "类型3 · 笑点枯竭"
      keywords: [不好笑, 硬抖机灵, 冷场, 梗老套]
      symptom: 笑点靠网络烂梗/硬抖，读者冷场
      callback: 笑点回到人物性格与处境反差——让角色认真做荒诞事，比讲段子更好笑。
    - type: "类型4 · 说教结尾"
      keywords: [说教, 讲道理, 总结升华, 大道理]
      symptom: 章末强行上价值/讲道理
      callback: 删掉价值总结，用一个没头没尾的吐槽或反差动作收尾，把余味交给读者。
    - type: "类型5 · AI 味堆积"
      keywords: [抽象情绪, ai味, AI味, 抽象, 总结升华]
      symptom: 连续多章出现抽象情绪
      callback: 用「对照样本」重写该章，强制具体动作/物件/对话节奏/个体反应。
    - type: "类型6 · 注水"
      keywords: [注水, 凑字数, 无笑点, 废话多]
      symptom: 章节无笑点无推进，为凑字数写流水账
      callback: 砍到「包袱」为止，宁可短章；结束条件是笑点落地，不是字数达标。

# ---------------- 单章内部自洽（确定性弱信号，只报 suspect，不判 fatal）----------------
self_consistency:
  enabled: true
  time_anchor:
    patterns: ['第[0-9一二三四五六七八九十百]+天', '第[0-9一二三四五六七八九十百]+章', '[0-9一二三四五六七八九十]{1,2}月[0-9一二三四五六七八九十]{1,3}[日号]', '[0-9一二三四五六七八九十]{1,2}[:：][0-9]{2}']
    unordered_words: [突然想起, 回到, 回忆, 倒叙, 与此同时, 前一天, 三天前, 上个月]
    max_backward_jumps: 1
  numeric_conflict:
    unit_pattern: '([0-9一二三四五六七八九十百千万两]+\.?[0-9]?)\s*(块|元|毛|斤|斤两|岁|天|年|次|个|只|条|人)'
    contradiction_words: [但, 却, 然而, 反而, 其实, 结果]
    window_chars: 60
  entity_alias:
    patterns: ['(?:老|小)[一-龥]{1,2}']
    min_occurrences: 2

# ---------------- 节奏信号（轻喜剧：快节奏，笑点密）----------------
pacing_signals:
  enabled: true
  # 通用基准词（doctor 判据样本依赖）+ 轻喜剧专属词叠加
  payoff_words: [成交, 拿下, 签下, 赚, 到手, 反杀, 打脸, 突破, 升级, 通过, 批准, 翻身, 回本, 兑现, 赢, 胜, 成功, 暗爽, 笑死, 绝了, 拆穿, 反将, 打脸, 翻车, 社死, 自食其果, 真香, 破功]
  conflict_words: [冲突, 争吵, 对峙, 威胁, 逼迫, 拒绝, 反击, 竞争, 质疑, 挑衅, 危机, 危险, 失败, 损失, 亏, 误会, 翻车, 社死, 拆台, 较劲, 算计落空, 计划泡汤]
  hook_words: [没想到, 却不知, 谁料, 殊不知, 竟然, 居然, 突然, 究竟, 原来, 直到, 才发现, 这时, 下一步, 等着, 果然, 且看, 不出所料, 反手, 谁能想到, 殊不知, 下一秒]
  payoff_per_2000_warn: 0.5
  conflict_per_1000_warn: 0.8
  hook_per_1000_warn: 0.7

# ---------------- 定位决策卡枚举（轻喜剧版）----------------
positioning_enums:
  爽点类型: [反套路, 误会化解, 社死现场, 毒舌反杀, 荒诞反差]
  反派类型: [奇葩对手, 势利眼, 系统规则, 自己人拆台]
  情感契约: [欢喜冤家, 战友吐槽, 亲情暖梗, 治愈日常]

# ---------------- 字数分层区间（轻喜剧：快节奏，字数偏小）----------------
# 必须保留「通用」键：init_project 的 tone 回退默认值
word_bands:
  通用: {静场: [1800, 2800], 常规: [2600, 3600], 反击: [3000, 4200], 高潮: [4000, 6000], 极短: [1000, 1800]}
  轻快: {静场: [1400, 2200], 常规: [2000, 3000], 反击: [2400, 3400], 高潮: [3200, 4600], 极短: [800, 1400]}
  爆笑: {静场: [1600, 2400], 常规: [2200, 3200], 反击: [2600, 3600], 高潮: [3400, 5000], 极短: [900, 1500]}

# ---------------- 发布闸门评分卡锚点（轻喜剧权重）----------------
rubric:
  dimensions:
    - {id: character, name: 人设/喜剧人格, weight: 0.25, max: 25}
    - {id: structure, name: 笑点结构与节奏, weight: 0.30, max: 30}
    - {id: continuity, name: 连续与伏笔, weight: 0.20, max: 20}
    - {id: writing, name: 喜剧语域与分寸, weight: 0.25, max: 25}
  grades: {A: 满分（无问题）, B: 轻微扣（1-2 处小问题）, C: 明显扣（多处/反复）, D: 严重扣（致命伤）}
  score_map:
    character: {A: 25, B: 20, C: 12, D: 0}
    structure: {A: 30, B: 24, C: 15, D: 0}
    continuity: {A: 20, B: 16, C: 10, D: 0}
    writing: {A: 25, B: 20, C: 12, D: 0}
  verdict: {pass: 80, revise: 70, fatal_overrides: true}
  compliance_items:
    - 无苦情虐心套路（出戏即打回）
    - 无强行煽情/说教结尾
    - 吐槽对事不对人，无拿弱势群体/灾难开涮
    - 笑点靠人物反差与处境，非网络烂梗硬凑
    - 无涉黄（露骨描写、擦边情节）
    - 无暴力虐杀细节（写意化处理）
    - 无违法教学（详细犯罪手法）
    - 情绪底色轻松向好（基调不塌陷）

# ---------------- 爽点密度 / 事件库轮换（轻喜剧版）----------------
cool_points:
  - 每章 ≥1 个笑点落地（包袱响，不是硬抖）
  - 每 3 章 ≥1 次反套路/误会升级
  - 每卷 3-5 个名场面（社死现场/毒舌反杀/荒诞反转）
  - 每 10 章 1 个中转盘；每卷末 1 个大反转
event_rotation:
  - 四类事件库：A 误会压迫 / B 吐槽反制 / C 反转打脸 / D 暖梗调剂，各备 10 个
  - 不连续两章用同一类
  - A 后必跟 B 或 C（误会→化解/打脸）
  - D 每 6-9 章一次（轻松向也需要情感温度，防纯闹剧疲劳）
  - C 用于「看似要输」的翻盘，须前文埋过反差伏笔

# ---------------- 开新书 7 步 SOP（轻喜剧版）----------------
sop:
  steps:
    - {step: 1, name: 定位（1 天）, tool: init_project, checks: [喜剧基调已定, 核心人设笑点已定, 差异化一句话说得清, 情感契约已选]}
    - {step: 2, name: 找对立面（0.5 天）★ 关键, tool: save_card(tone), checks: [每个维度都能说出我不是什么, 对照表覆盖苦情/说教/油腻/毒舌边界]}
    - {step: 3, name: 建锁定层（1-2 天）, tool: save_card, checks: [喜剧人格边界清晰, 吐槽分寸已定（对事不对人）, 反派有真实阻力, 笑点素材库已建]}
    - {step: 4, name: 建结构层（2-3 天）, tool: add_foreshadow/save_outline, checks: [笑点节奏已定, 每章有包袱, 伏笔编号含埋设/回收章, 事件库 40+]}
    - {step: 5, name: 建执行层（1 天）, tool: prompt build_system_prompt, checks: [prompt 含禁苦情词, 节奏分层区间非死数, 喜剧专属词表, 吐槽尺度已定]}
    - {step: 6, name: 建质检层（0.5 天）, tool: review_chapter/release_gate, checks: [评审分层, 有防强行煽情检测项, 分寸已核, 漂移回调方案具体]}
    - {step: 7, name: 小批量试产→评审→量产, tool: 试产10章+review_chapter, checks: [前 10 章已试产, 全审已跑, 问题已回调到规则层, 重跑确认稳定]}

# ---------------- 事实抽取 / 评审回流（P1 闭环）----------------
fact_extract:
  enabled: true
  unit_pattern: '([0-9一二三四五六七八九十百千万两]+\.?[0-9]?)\s*(块|元|毛|斤|岁|天|年|次|个|只|条|人)'
  label_chars: 8
  min_occurrences: 2
  max_anchors: 40
chapter_brief:
  enabled: true
  max_avoid: 8
  max_foreshadow: 8
  overdue_chapters: 10
