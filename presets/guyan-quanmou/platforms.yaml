# 大禹 · 风格预设：古言权谋 —— 平台档案
# 数据来源：公开投稿/签约资料整理，以各平台官方最新公告为准
# 被 config.ts 的 getPlatform() 读取；未知平台回退通用档并标 _fallback
version: "0.2.0-guyan.1"
defaults:
  must_avoid: [涉政影射, 真实历史人物直接影射, 涉黄低俗, 可复现犯罪手法, 美化违法或校园霸凌, 三观严重偏离, 现代词/网络语出戏]
platforms:
  qidian:
    name: 起点女生网·古代言情
    unsigned_traffic: 有
    exclusive: 分成/买断可选
    genres: [古代言情, 权谋, 宫廷侯爵, 王朝兴衰]
    patience: 较高
    title_min_chars: 5
    daily_words: [4000, 6000]
    golden_window: {conflict: 1200, golden_finger: 3000, payoff: 5000}
  jinjiang:
    name: 晋江文学城·古言权谋
    unsigned_traffic: 有
    exclusive: 签约制（年限长，签人不签书）
    genres: [古言权谋, 宫廷, 女性成长, 强强]
    patience: 中
    title_min_chars: 5
    daily_words: [4000, 6000]
    golden_window: {conflict: 800, golden_finger: 2000, payoff: 4000}
  custom:
    name: 自定义平台（古言通用档）
    unsigned_traffic: 未提供公开标准，按古言权谋通用标准评审
    exclusive: 签约前需自行确认
    genres: []
    patience: 未知
    title_min_chars: 5
    daily_words: [4000, 8000]
    golden_window: {conflict: 800, golden_finger: 2000, payoff: 4000}
    _fallback_template: true
